[env:wbmge]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters =
    direct
    colorize
    esp32_exception_decoder
board_build.filesystem = littlefs
board_build.flash_mode = dio
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ArduinoJSON
    FS
    https://github.com/lan143/ed-mqtt#3743746af47e609e68c1b2099d1ff68a6bef2330
    https://github.com/lan143/ed-config#f39f0a80f528aa62a78bb5fcaaec0966732df190
    https://github.com/lan143/ed-utils#6fba146934d5a0d55896eed8a2a7f4c0ee6065b0
    https://github.com/lan143/ed-ha#0116d734dec736a90035779c20ddaf27fb7396fd
    https://github.com/lan143/ed-healthcheck#e5fd3954732feb1a92e18348689e05c4696acc5f
    https://github.com/lan143/ed-wb#a557534e01708a0614c4f9f0eb67a69dcbdb7d74
    https://github.com/lan143/ed-network#6624701d87736e7dc64a55c4ac502a64f74edc54
    TCA9555
    https://github.com/lan143/ed-common#a382e044692bcd57e14a37e004108f9c4824eadd
    FastLED
    NTPClient
build_flags=
    -Wshadow
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_LOG_COLORS=1

[env:wbmge_ota]
extends = env:wbmge
upload_protocol = espota
upload_port = 192.168.1.48
upload_flags = --auth=somestrongpassword 
